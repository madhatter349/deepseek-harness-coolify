# DeepSeek Harness — web profile patch (Coolify deployment, file-managed).
#
# Every provider route below is credential-free: keys resolve from names at
# request time (DSH_LLM_API_KEY, DSH_AMD_API_KEY, DSH_OPENCODE_API_KEY,
# DSH_CLINE_API_KEY) and are set only in the Coolify environment.
#
# Route/endpoint from environment:
#   DSH_LLM_BASE_URL           OpenAI-compatible API root (CI gateway)
#   DSH_LLM_CONTEXT_WINDOW     fallback capacity for models without one
#   DSH_LLM_MAX_OUTPUT_TOKENS  fallback output cap for models without one
#
# Edit this file and restart the container to add or remove models. The
# deployment overlay enables HMR polling: default-model edits apply live,
# provider-route edits need the restart on 0.2.0-rc.2.

# Hide the official DeepSeek catalogue: unconfigured here and its installed
# names ("DeepSeek-V41-Flash") duplicate the gateway models. Remove this row
# (or set DEEPSEEK_API_KEY) to bring it back.
- id: llm-deepseek
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      # ── CheapestInference queue gateway (OpenAI-compatible) ──────────────
      dsh-gateway:
        apiKeyEnv: DSH_LLM_API_KEY
        displayName: CI Gateway (queue)
        api: openai-completions
        baseURL: !!js process.env.DSH_LLM_BASE_URL ?? 'https://api.deepseek.com/v1'
        defaultContextWindow: !!js Number(process.env.DSH_LLM_CONTEXT_WINDOW ?? 131072)
        defaultMaxTokens: !!js Number(process.env.DSH_LLM_MAX_OUTPUT_TOKENS ?? 8192)
        compat:
          supportsStore: false
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          supportsUsageInStreaming: true
          supportsFinishReason: true
          maxTokensField: max_tokens
          thinkingFormat: deepseek
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash (Gateway)
            contextWindow: 1000000
            maxTokens: 8192
            input: [text]
            reasoningEfforts:
              off:
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            compat:
              requiresReasoningContentOnAssistantMessages: true
          - id: mimo-v2.6-flash
            name: MiMo V2.6 Flash (Gateway)
            contextWindow: 1048576
            maxTokens: 16384
            input: [text, image]
            reasoningEfforts:
              minimal: low
              low: low
              medium: medium
              high: high
              xhigh: high
              max: high
            compat:
              requiresReasoningContentOnAssistantMessages: true

      # ── AMD Radeon developer API ─────────────────────────────────────────
      dsh-amd:
        apiKeyEnv: DSH_AMD_API_KEY
        displayName: AMD Radeon
        api: openai-completions
        baseURL: https://developer.amd.com.cn/radeon/api/v1
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          maxTokensField: max_tokens
          supportsUsageInStreaming: true
          supportsFinishReason: true
        models:
          - id: DeepSeek-V4.1-Flash
            name: DeepSeek V4.1 Flash (AMD Radeon)
            contextWindow: 1048576
            maxTokens: 16384
            input: [text, image]
            reasoningEfforts:
              off: none
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: high
              max: high
          - id: MiMo-V2.6-Flash
            name: MiMo V2.6 Flash (AMD Radeon)
            contextWindow: 1048576
            maxTokens: 16384
            input: [text, image]
            reasoningEfforts:
              off: none
              minimal: low
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max

      # ── OpenCode Zen (needs the session-routing header) ──────────────────
      dsh-opencode:
        apiKeyEnv: DSH_OPENCODE_API_KEY
        displayName: OpenCode Go
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        headers:
          x-opencode-session: dsh-b6b55b728452c4390a59c8f0dd69d92a
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash (OpenCode)
            contextWindow: 1000000
            maxTokens: 16384
            input: [text, image]
            compat:
              supportsStore: false
              supportsDeveloperRole: false
              maxTokensField: max_tokens
              requiresReasoningContentOnAssistantMessages: true
              thinkingFormat: deepseek
            reasoningEfforts:
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max

      # ── ClinePass (works on the streaming promo route) ──────────────────
      # Use the prefixed `cline-pass/…` ids with streaming exactly as pi does.
      # The canonical `deepseek/…`/`xiaomi/…` ids bill Cline Credits and
      # answer HTTP 402 at a negative balance — do not switch to them.
      dsh-cline:
        apiKeyEnv: DSH_CLINE_API_KEY
        displayName: ClinePass
        api: openai-completions
        baseURL: https://api.cline.bot/api/v1
        models:
          - id: cline-pass/deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash (Cline)
            contextWindow: 1000000
            maxTokens: 16384
            input: [text]
            reasoningEfforts:
              minimal: low
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: cline-pass/mimo-v2.6-flash
            name: MiMo V2.6 Flash (Cline)
            contextWindow: 1048576
            maxTokens: 16384
            input: [text, image]
            reasoningEfforts:
              minimal: low
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max

- id: agent-default-model
  config:
    provider: dsh-gateway
    model: deepseek-v4.1-flash
